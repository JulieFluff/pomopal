<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self' https://*.supabase.co">
  <title>Focus</title><link rel="icon" href="assets/icons/mug.svg"><link rel="stylesheet" href="web.css">
</head>
<body class="web">
<!-- Browser version (work look, locked design docs/PomoPal_work-look-mockup.html, Val 2026-11-18).
     It keeps every id the shared ../renderer/app.js needs, so the Mac app's code runs it unchanged. -->
<main class="app-shell" aria-label="Focus timer">
  <section id="timer-view" class="card timer-card">
    <header class="top full-only">
      <button id="mascot" class="mug-button" type="button" data-active="tomato" aria-label="Focus timer">
        <svg class="mug" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10h11v6a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4z"/><path d="M16 12h1.5a2.5 2.5 0 0 1 0 5H16"/><path class="steam" d="M9 3.5c-.8.9-.8 2.1 0 3"/><path class="steam s2" d="M12.5 3.5c-.8.9-.8 2.1 0 3"/></svg>
      </button>
      <nav class="tools" aria-label="Menu">
        <button id="open-log" class="text-link" type="button">Log</button>
        <button id="compact-toggle" class="icon-button popout-icon" type="button" aria-label="Pop out the timer" title="Pop out the timer"></button>
        <button id="mute-toggle" class="icon-button sound-icon" type="button" aria-label="Mute sounds" aria-pressed="false"></button>
        <button id="theme-toggle" class="icon-button theme-icon" type="button" aria-label="Switch to dark mode" aria-pressed="false"></button>
      </nav>
    </header>
    <div id="category-slot" class="full-only"></div>
    <p id="status" class="hidden-status" aria-hidden="true">Ready when you are</p>
    <p id="web-status" class="status full-only" aria-live="polite">Ready</p>
    <output id="time" class="time" aria-label="Time remaining">25:00</output>
    <div class="progress full-only" aria-hidden="true"><i id="progress-bar"></i></div>
    <div class="intention-wrap full-only">
      <label for="intention">What are you working on?</label>
      <input id="intention" maxlength="120" autocomplete="off" aria-autocomplete="list" aria-controls="suggestions">
      <div id="suggestions" class="suggest" role="listbox" aria-label="Earlier tasks" hidden></div>
    </div>
    <div id="timer-controls" class="controls full-only">
      <button id="start-stop" class="primary" type="button">Start</button>
      <div class="links"><button id="log-time" class="text-link strong" type="button" title="Stop now and log the time so far" disabled>Done</button><button id="reset" class="text-link" type="button">Reset</button></div>
      <p id="done-hint" class="hint" hidden>Done = stop now and log the time so far</p>
    </div>
    <div class="presets full-only" aria-label="Timer length">
      <span class="duration-row"><button type="button" data-minutes="5" aria-pressed="false">5</button><button type="button" data-minutes="15" aria-pressed="false">15</button><button type="button" data-minutes="25" class="selected" aria-pressed="true">25</button></span>
      <button id="custom-toggle" class="text-link" type="button" aria-expanded="false">Custom</button>
    </div>
    <form id="custom-duration" class="custom-duration full-only" hidden><label for="custom-minutes">Minutes</label><input id="custom-minutes" type="number" min="1" max="180" step="1" inputmode="numeric" required><button type="submit" class="text-link strong">Set</button></form>
    <!-- The shared app's own "time's up" choices; the browser version uses the note card below instead. -->
    <div id="completion-actions" class="app-only" hidden><span id="completed-task"></span><button id="continue-task" type="button">Continue</button><button id="new-task" type="button">New task</button><button id="expand-toggle" type="button">Back</button><input id="always-on-top" type="checkbox"></div>
  </section>

  <section id="note-card" class="card note-card full-only" aria-label="Logged" hidden>
    <p class="status note-status">
      <svg class="mug" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10h11v6a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4z"/><path d="M16 12h1.5a2.5 2.5 0 0 1 0 5H16"/><path class="steam" d="M9 3.5c-.8.9-.8 2.1 0 3"/><path class="steam s2" d="M12.5 3.5c-.8.9-.8 2.1 0 3"/></svg>
      <span id="note-status">Time's up · logged</span>
    </p>
    <p id="note-title" class="note-title"></p>
    <p id="note-sub" class="note-sub"></p>
    <label for="note-text">Add a note (optional)</label>
    <textarea id="note-text" maxlength="1000"></textarea>
    <button id="save-note" class="primary" type="button">Save note</button>
    <div class="links"><button id="skip-note" class="text-link" type="button">Skip</button><button id="same-again" class="text-link" type="button">Same task again</button></div>
  </section>

  <section id="log-view" class="card log-card full-only" aria-label="Log" hidden></section>

  <p class="web-popped mini-only">The timer is in the pop-out window · <button id="bring-back" class="text-link" type="button">Bring it back</button></p>
</main>
<dialog id="settings-dialog" aria-label="Settings">
  <form method="dialog"><select id="finish-sound" aria-label="Finish sound"><option value="random">Surprise me</option><option value="bright">Bright</option><option value="gentle">Gentle</option><option value="sparkle">Sparkle</option></select></form>
</dialog>
<script src="renderer/timer-model.js"></script><script src="renderer/finish-sounds.js"></script><script src="renderer/preferences.js"></script><script src="web-log.js"></script><script src="web-bridge.js"></script><script src="renderer/app.js"></script><script src="web-config.js"></script><script src="web-sync.js"></script><script src="web-extras.js"></script>
</body></html>
